<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Dashboard | عطر النخبة</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body class="admin-body"><header class="admin-nav"><div><a class="logo" href="/">عطر <span>النخبة</span> ✦</a><small>لوحة التحكم</small></div><div class="admin-actions"><a href="/">زيارة المتجر</a><button id="logout">تسجيل الخروج</button></div></header><main class="admin-wrap"><section class="dash-head"><div><span class="eyebrow">STORE CONTROL CENTER</span><h1>لوحة التحكم</h1><p>إدارة المنتجات والطلبات ومتابعة أداء المتجر.</p></div></section><section class="stats"><article><span>المنتجات</span><strong id="p">0</strong></article><article><span>الطلبات</span><strong id="o">0</strong></article><article><span>قيد المتابعة</span><strong id="pending">0</strong></article><article><span>الإيرادات</span><strong><span id="r">0</span> ر.س</strong></article></section><section class="admin-grid"><div class="panel"><div class="panel-head"><div><span class="eyebrow">CATALOG</span><h2>إضافة منتج</h2></div></div><form id="form" class="product-form"><input id="pn" placeholder="اسم المنتج" required><input id="pb" placeholder="البراند"><input id="pp" type="number" min="0" placeholder="السعر" required><input id="ps" type="number" min="0" placeholder="المخزون" required><select id="pc"><option>عطور رجالية</option><option>عطور نسائية</option><option>عطور شرقية</option><option>عطور نيش</option></select><input id="pt" placeholder="الشارة: جديد / مميز"><input id="pi" placeholder="رابط صورة المنتج" required><textarea id="pd" placeholder="وصف المنتج"></textarea><button class="admin-btn" type="submit">إضافة المنتج</button></form></div><div class="panel"><div class="panel-head"><div><span class="eyebrow">ORDERS</span><h2>آخر الطلبات</h2></div><button class="refresh" onclick="load()">تحديث</button></div><div id="orders" class="orders-list"></div></div></section><section class="panel products-panel"><div class="panel-head"><div><span class="eyebrow">PRODUCTS</span><h2>المنتجات الحالية</h2></div></div><div id="productsAdmin"></div></section></main><div id="editModal" class="modal hidden"><div class="modal-box"><button class="close" onclick="closeEdit()">×</button><h2>تعديل المنتج</h2><form id="editForm" class="product-form"><input id="en" required><input id="eb"><input id="ep" type="number" min="0" required><input id="es" type="number" min="0" required><select id="ec"><option>عطور رجالية</option><option>عطور نسائية</option><option>عطور شرقية</option><option>عطور نيش</option></select><input id="et"><input id="ei" required><textarea id="ed"></textarea><button class="admin-btn">حفظ التعديلات</button></form></div></div><script src="admin.js"></script></body></html>
